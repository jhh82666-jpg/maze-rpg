<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="description" content="迷宫 RPG — 2D 迷宫探索回合制 RPG（Phaser 3）" />
    <title>迷宫 RPG · Maze RPG</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0d12;
        font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }

      /* 舞台容器：唯一负责画布居中的地方。
         Phaser 侧的 autoCenter 已关闭（见 config/gameConfig.ts），
         避免它再往 canvas 写 margin 与这里的 flex 打架。 */
      #game-root {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0d12;
      }

      #game-root canvas {
        display: block;
        touch-action: none;
        /* 覆盖 Phaser 可能残留的居中 margin，确保由上面的 flex 决定位置 */
        margin: 0 !important;
        /* 画布左右两侧的余量用底色补齐，视觉上与舞台连成一片 */
        background: #0b0d12;
      }

      /* 首帧之前的加载占位，Phaser 接管后自动被覆盖 */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #0b0d12;
        color: #8fa3c8;
        font-size: 14px;
        letter-spacing: 2px;
        z-index: 10;
        transition: opacity 260ms ease;
        pointer-events: none;
      }

      #boot-splash.hidden {
        opacity: 0;
      }

      #boot-splash .title {
        font-size: 22px;
        color: #d7e3ff;
        letter-spacing: 6px;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-Bqb3Txiu.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/phaser-DXXWZowi.js">
  </head>
  <body>
    <div id="game-root"></div>
    <div id="boot-splash">
      <div class="title">迷宫 RPG</div>
      <div>正在初始化…</div>
    </div>
    <script>
      // 新手保护：本文件必须经由 Vite **开发服务器**打开（npm run dev）。
      // 直接双击 / 用 file:// 打开时，下面的 <script type="module" src="/src/main.ts">
      // 会被浏览器按 CORS 策略拦截（origin null），游戏脚本根本不执行，
      // 页面就永远停在「正在初始化…」——看起来像卡死，其实什么都没跑。
      // 这里加一个兜底提示，把真正的原因和正确做法直接说给使用者。
      window.addEventListener('load', () => {
        setTimeout(() => {
          if (location.protocol === 'file:' && !document.querySelector('#game-root canvas')) {
            const splash = document.getElementById('boot-splash');
            if (!splash) return;
            splash.innerHTML =
              '<div class="title">迷宫 RPG</div>' +
              '<div style="color:#ffd400">请勿直接双击打开 index.html</div>' +
              '<div style="max-width:520px;line-height:1.9;text-align:center;letter-spacing:0">' +
              '本文件需要 Vite 开发服务器才能运行：<br>' +
              '在项目目录执行 <b>npm run dev</b>，再访问 ' +
              '<b>http://127.0.0.1:5173</b><br>' +
              '若要离线双击即玩，请改开 <b>dist/index.offline.html</b>' +
              '<br>（先执行一次 <b>npm run build:offline</b> 生成）' +
              '</div>';
          }
        }, 2500);
      });
    </script>
  </body>
</html>
